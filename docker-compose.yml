services:
  # ── Agent 应用（可选 — 开发时通常直接在本地运行 main.py）──
  agent:
    build: .
    image: langgraph-agent:latest
    stdin_open: true
    tty: true
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      # docker.sock 不再挂载：代码执行通过独立 Docker-in-Docker 容器进行
      # 如需宿主机执行，通过 DOCKER_HOST 环境变量指向远程 Docker 守护进程
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - POSTGRES_URL=postgresql://langgraph:langgraph123@postgres:5432/langgraph
      - LANGFUSE_HOST=http://langfuse:3000
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      postgres:
        condition: service_healthy
    profiles:
      - full

  # ── MCP Services (Streamable HTTP) ──

  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:latest
    ports:
      - "8931:8931"
    entrypoint: node
    command:
      - /app/cli.js
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --port
      - "8931"
      - --host
      - "0.0.0.0"
    profiles:
      - mcp
      - full
    restart: unless-stopped

  # ── 基础设施 ──

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./data/neo4j:/data
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=langgraph
      - POSTGRES_PASSWORD=langgraph123
      - POSTGRES_DB=langgraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph"]
      interval: 5s
      timeout: 5s
      retries: 5

#  langfuse:
#    image: langfuse/langfuse:2
#    ports:
#      - "3000:3000"
#    environment:
#      - DATABASE_URL=postgresql://langgraph:langgraph123@postgres:5432/langfuse
#      - NEXTAUTH_SECRET=langfuse-dev-secret-change-in-production
#      - NEXTAUTH_URL=http://localhost:3000
#      - SALT=langfuse-salt
#      - TELEMETRY_ENABLED=false
#    depends_on:
#      postgres:
#        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── SearXNG 元搜索引擎（联网搜索 MCP 后端）──
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8088:8080"
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8088
    restart: unless-stopped
