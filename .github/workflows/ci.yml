name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/

      - name: Ruff format check
        run: ruff format --check src/

  # ── Frontend Build ──
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx vue-tsc --noEmit

      - name: Build frontend
        run: cd frontend && npm run build

      # 验证构建产物存在
      - name: Verify dist
        run: test -f frontend/dist/index.html

  # ── Test ──
  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      LLM_API_KEY: ci-test-key
      LLM_BASE_URL: https://api.deepseek.com
      EMBEDDING_API_KEY: ci-test-key
      EMBEDDING_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-mock

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── Build Docker image ──
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Create dummy .env for CI build
        run: |
          cat > .env << 'EOF'
          LLM_API_KEY=ci-dummy
          LLM_BASE_URL=https://api.deepseek.com
          EMBEDDING_API_KEY=ci-dummy
          EMBEDDING_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
          QDRANT_URL=http://localhost:6333
          NEO4J_URI=bolt://localhost:7687
          POSTGRES_URL=postgresql://test@localhost:5432/test
          JWT_SECRET_KEY=ci-dummy-jwt-secret
          LANGFUSE_PUBLIC_KEY=
          LANGFUSE_SECRET_KEY=
          LANGFUSE_HOST=
          TAVILY_API_KEY=
          EOF

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: langgraph-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker run --rm langgraph-agent:ci python -c "from agent.graph import build_agent; print('OK')"
